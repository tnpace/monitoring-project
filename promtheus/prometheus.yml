global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "Linux Server"
    static_configs:
      - targets: ["10.10.2.21:9100"]
      - targets: ["10.10.2.22:9100"]
      - targets: ["10.10.2.23:9100"]
      - targets: ["10.10.2.24:9100"]
      - targets: ["10.10.2.25:9100"]
      - targets: ["10.10.2.26:9100"]
      - targets: ["10.10.2.27:9100"]
      - targets: ["10.10.2.28:9100"]
      - targets: ["10.10.2.29:9100"]
      - targets: ["10.10.2.30:9100"]
      - targets: ["10.10.2.31:9100"]
      - targets: ["10.10.2.32:9100"]
      - targets: ["10.10.2.33:9100"]
      - targets: ["10.10.2.34:9100"]
      - targets: ["10.10.2.35:9100"]
      - targets: ["10.10.2.36:9100"]
      - targets: ["10.10.2.37:9100"]
      - targets: ["10.10.2.38:9100"]
      - targets: ["10.10.2.39:9100"]
      - targets: ["10.10.2.40:9100"]
      - targets: ["10.10.2.41:9100"]
      - targets: ["10.10.2.42:9100"]
      - targets: ["10.10.2.43:9100"]
      - targets: ["10.10.2.44:9100"]
      - targets: ["10.10.2.213:9100"]


  - job_name: "telegraf"
    static_configs:
      - targets:
          - telegraf:9273


  - job_name: "vmware_esxi"
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/esx.yml

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: vmware_exporter:9272

  - job_name: 'cadvisor'
    static_configs:
      - targets: ["10.10.2.42:9111"]
        labels:
          host: MNTRGLV01

      - targets: ["10.10.2.44:9111"]
        labels:
          host: MINIOLV01
