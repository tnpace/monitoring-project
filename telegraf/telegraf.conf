[agent]
  interval = "30s"
  round_interval = true
  flush_interval = "30s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_jitter = "0s"
  precision = ""

###############################################################################
# OPTIONAL: rapihin format log date (kalau field log-dates memang string yyyymmdd...)
# Kalau ternyata iDRAC kamu tidak mengisi log-dates atau formatnya beda, kamu bisa comment block ini.
###############################################################################
[[processors.regex]]
  namepass = ["idrac-hosts"]
  [[processors.regex.fields]]
    key = "log-dates"
    pattern = "^(?P<YYYY>\\d{4})(?P<MM>\\d{2})(?P<DD>\\d{2})(?P<HH>\\d{2})(?P<mm>\\d{2})(?P<ss>\\d{2})\\.(?P<usec>\\d{6})(?P<tz>[-+]\\d{3,4})$"
    replacement = "${YYYY}-${MM}-${DD} ${HH}:${mm}:${ss}"

###############################################################################
# INPUT: SNMP iDRAC
###############################################################################
[[inputs.snmp]]
  ## iDRAC list
  agents = [
    "udp://ip:161",
    "udp://ip:161",
    "udp://ip:161",
    "udp://ip:161"
  ]

  ## Pakai 2 untuk v2c (paling umum). Kalau iDRAC kamu memang v1, ganti ke 1.
  version = 2
  community = "public"
  timeout = "5s"
  retries = 2

  ## Ini yang bikin Grafana bisa filter host berdasarkan IP agent
  agent_host_tag = "source"

  ## INI PENTING: measurement harus idrac-hosts (sesuai dashboard flux)
  name = "idrac-hosts"

  ## TAG: system-name (sesuai dashboard)
  [[inputs.snmp.field]]
    name = "system-name"
    oid  = ".1.3.6.1.2.1.1.5.0"
    is_tag = true

  ## Basic info
  [[inputs.snmp.field]]
    name = "system-osname"
    oid  = ".1.3.6.1.4.1.674.10892.5.1.3.6.0"

  [[inputs.snmp.field]]
    name = "system-osversion"
    oid  = ".1.3.6.1.4.1.674.10892.5.1.3.14.0"

  [[inputs.snmp.field]]
    name = "system-model"
    oid  = ".1.3.6.1.4.1.674.10892.5.1.3.12.0"

  [[inputs.snmp.field]]
    name = "idrac-url"
    oid  = ".1.3.6.1.4.1.674.10892.5.1.1.6.0"

  [[inputs.snmp.field]]
    name = "power-state"
    oid  = ".1.3.6.1.4.1.674.10892.5.2.4.0"

  [[inputs.snmp.field]]
    name = "system-uptime"
    oid  = ".1.3.6.1.4.1.674.10892.5.2.5.0"

  [[inputs.snmp.field]]
    name = "system-servicetag"
    oid  = ".1.3.6.1.4.1.674.10892.5.1.3.2.0"

  [[inputs.snmp.field]]
    name = "system-globalstatus"
    oid  = ".1.3.6.1.4.1.674.10892.5.2.1.0"

  ## Fans
  [[inputs.snmp.field]] name = "fan1-speed" oid = ".1.3.6.1.4.1.674.10892.5.4.700.12.1.6.1.1"
  [[inputs.snmp.field]] name = "fan2-speed" oid = ".1.3.6.1.4.1.674.10892.5.4.700.12.1.6.1.2"
  [[inputs.snmp.field]] name = "fan3-speed" oid = ".1.3.6.1.4.1.674.10892.5.4.700.12.1.6.1.3"
  [[inputs.snmp.field]] name = "fan4-speed" oid = ".1.3.6.1.4.1.674.10892.5.4.700.12.1.6.1.4"
  [[inputs.snmp.field]] name = "fan5-speed" oid = ".1.3.6.1.4.1.674.10892.5.4.700.12.1.6.1.5"
  [[inputs.snmp.field]] name = "fan6-speed" oid = ".1.3.6.1.4.1.674.10892.5.4.700.12.1.6.1.6"

  ## Temps
  [[inputs.snmp.field]] name = "inlet-temp"   oid = ".1.3.6.1.4.1.674.10892.5.4.700.20.1.6.1.1"
  [[inputs.snmp.field]] name = "exhaust-temp" oid = ".1.3.6.1.4.1.674.10892.5.4.700.20.1.6.1.2"
  [[inputs.snmp.field]] name = "cpu1-temp"    oid = ".1.3.6.1.4.1.674.10892.5.4.700.20.1.6.1.3"
  [[inputs.snmp.field]] name = "cpu2-temp"    oid = ".1.3.6.1.4.1.674.10892.5.4.700.20.1.6.1.4"

  ## Others
  [[inputs.snmp.field]]
    name = "cmos-batterystate"
    oid  = ".1.3.6.1.4.1.674.10892.5.4.600.50.1.6.1.1"

  [[inputs.snmp.field]]
    name = "system-watts"
    oid  = ".1.3.6.1.4.1.674.10892.5.4.600.30.1.6.1.3"

  #############################################################################
  # TABLES: disk, logs, nic, dll
  #############################################################################
  [[inputs.snmp.table]]
    name = "idrac-hosts"
    inherit_tags = ["system-name"]

    [[inputs.snmp.table.field]] name = "bios-version"        oid = ".1.3.6.1.4.1.674.10892.5.4.300.50.1.8"
    [[inputs.snmp.table.field]] name = "raid-batterystate"   oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.15.1.4"
    [[inputs.snmp.table.field]] name = "intrusion-sensor"    oid = ".1.3.6.1.4.1.674.10892.5.4.300.70.1.6"

    [[inputs.snmp.table.field]] name = "disks-name"          oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.4.1.2"  is_tag = true
    [[inputs.snmp.table.field]] name = "disks-mediatype"     oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.4.1.35"
