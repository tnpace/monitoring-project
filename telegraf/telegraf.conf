    [[inputs.snmp.table.field]] name = "disks-capacity"      oid = ".1.3.6.1.4.1.674.10892.5.5.1.20.130.4.1.11"

    [[inputs.snmp.table.field]] name = "memory-status"       oid = ".1.3.6.1.4.1.674.10892.5.4.200.10.1.27"
    [[inputs.snmp.table.field]] name = "storage-status"      oid = ".1.3.6.1.4.1.674.10892.5.2.3"
    [[inputs.snmp.table.field]] name = "temp-status"         oid = ".1.3.6.1.4.1.674.10892.5.4.200.10.1.63"
    [[inputs.snmp.table.field]] name = "psu-status"          oid = ".1.3.6.1.4.1.674.10892.5.4.200.10.1.9"

    [[inputs.snmp.table.field]] name = "log-number"          oid = ".1.3.6.1.4.1.674.10892.5.4.300.40.1.2" is_tag = true
    [[inputs.snmp.table.field]] name = "log-entry"           oid = ".1.3.6.1.4.1.674.10892.5.4.300.40.1.5"
    [[inputs.snmp.table.field]] name = "log-severity"        oid = ".1.3.6.1.4.1.674.10892.5.4.300.40.1.7"
    [[inputs.snmp.table.field]] name = "log-dates"           oid = ".1.3.6.1.4.1.674.10892.5.4.300.40.1.8"

    [[inputs.snmp.table.field]] name = "nic-name"            oid = ".1.3.6.1.4.1.674.10892.5.4.1100.90.1.30" is_tag = true
    [[inputs.snmp.table.field]] name = "nic-vendor"          oid = ".1.3.6.1.4.1.674.10892.5.4.1100.90.1.7"
