    [[inputs.snmp.table.field]] name = "nic-current_mac"     oid = ".1.3.6.1.4.1.674.10892.5.4.1100.90.1.15" conversion = "hwaddr"



###############################################################################
# OUTPUT: InfluxDB v2
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["http://ip:8086"]
  token = "token"
  organization = "monitoring"
  bucket = "idrac"
